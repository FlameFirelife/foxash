[package]
name = "foxash"
version = "1.3.0"
edition = "2021"

[dependencies]
rand = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
